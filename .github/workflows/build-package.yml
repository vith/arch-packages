name: Build one package
run-name: Build ${{ inputs.package }} / ${{ inputs.publication_run }}.${{ inputs.publication_attempt }}
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Parent workflow type
        type: choice
        options: [publication, candidate]
        default: publication
      package:
        description: Package to build
        required: true
        type: choice
        options: [archive-mounter, carapace, nasc-tui-bin, cloudflare-speed-cli, oh-my-pi-vith-git, python-google-genai, apexshot]
      publication_run:
        description: Publication plan run ID
        required: true
        type: string
      publication_attempt:
        description: Publication plan attempt
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WORK: /home/runner/.local/state/arch-packages/build-${{ github.run_id }}
      TMPDIR: /home/runner/.local/state/arch-packages/build-${{ github.run_id }}/tmp
      ARCH_BUILD_CACHE: /home/runner/.local/state/arch-packages/cache/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.kind == 'candidate' && 'prepared-candidate' || format('publication-plan-{0}', inputs.publication_attempt) }}
          run-id: ${{ inputs.publication_run }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}
      - name: Prepare only the selected recipe
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          PUBLICATION: ${{ inputs.publication_run }}
          ATTEMPT: ${{ inputs.publication_attempt }}
          KIND: ${{ inputs.kind || 'publication' }}
        run: |
          mkdir -p "$TMPDIR"
          python3 -m tools.package_runs prepare "$WORK" --package "$PACKAGE" --publication-run "$PUBLICATION" --publication-attempt "$ATTEMPT" --kind "$KIND"
      - name: Restore this package's trusted build cache
        if: inputs.kind != 'candidate'
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.ARCH_BUILD_CACHE }}
          key: ${{ steps.prepare.outputs.cache-key }}
          restore-keys: |
            ${{ steps.prepare.outputs.cache-input-prefix }}
            ${{ steps.prepare.outputs.cache-prefix }}
      - name: Build package without credentials
        id: build
        env:
          KIND: ${{ inputs.kind }}
        run: |
          if [[ "$KIND" == candidate ]]; then unset ARCH_BUILD_CACHE; fi
          tools/build.sh "$WORK/input/bundle.json" "$WORK/output"
      - name: Make cache readable by the runner
        if: ${{ always() && inputs.kind != 'candidate' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [[ -d "$ARCH_BUILD_CACHE" ]]; then
            sudo chown -R --no-dereference "$(id -u):$(id -g)" "$ARCH_BUILD_CACHE"
          fi
      - name: Save build progress for later runs
        if: ${{ always() && !cancelled() && inputs.kind != 'candidate' && steps.build.outcome != 'skipped' && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.ARCH_BUILD_CACHE }}
          key: ${{ steps.prepare.outputs.cache-key }}
      - name: Pack outputs
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          work = pathlib.Path(os.environ['WORK'])
          with tarfile.open(work / 'unsigned.tar', 'w') as archive:
              for path in sorted((work / 'output').iterdir()):
                  archive.add(path, arcname=path.name, recursive=False)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-${{ inputs.package }}
          overwrite: true
          path: ${{ env.WORK }}/unsigned.tar
          if-no-files-found: error
          retention-days: 7
