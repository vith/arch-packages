name: Build one package
run-name: Build ${{ inputs.package }} / ${{ inputs.publication_run }}.${{ inputs.publication_attempt }} / ${{ inputs.input_digest }}
on:
  workflow_dispatch:
    inputs:
      package:
        description: Explicitly authorized package
        required: true
        type: string
      publication_run:
        description: Original approval candidate run ID
        required: true
        type: string
      publication_attempt:
        description: Original approval candidate attempt
        required: true
        type: string
      recovery_mode:
        description: Transport-only recovery of an original successful compilation
        type: boolean
        default: false
      original_run:
        description: Original successful producer run, transport recovery only
        type: string
        default: ''
      original_attempt:
        description: Original successful producer attempt, transport recovery only
        type: string
        default: ''
      original_artifact:
        description: Exact original immutable artifact ID and ZIP digest, transport recovery only
        type: string
        default: ''
      archive_format:
        description: Authenticated original archive protocol
        type: choice
        options: [native-v2, legacy-native-v1]
        default: native-v2
      original_candidate_key:
        description: Original historical candidate receipt key, legacy transport recovery only
        type: string
        default: ''
      input_digest:
        description: Exact authorized compilation input digest
        required: true
        type: string
permissions:
  contents: write
  actions: read
  statuses: write
  id-token: write
  attestations: write
concurrency:
  group: approved-package-${{ inputs.input_digest }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WORK: /home/runner/.local/state/arch-packages/build-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /home/runner/.local/state/arch-packages/build-${{ github.run_id }}-${{ github.run_attempt }}/tmp
      ARCH_BUILD_CACHE: /home/runner/.local/state/arch-packages/cache/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ !inputs.recovery_mode }}
        with:
          name: prepared-candidate-${{ inputs.publication_attempt }}
          run-id: ${{ inputs.publication_run }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}
      - name: Authenticate approval and recover original successful bytes
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          PUBLICATION: ${{ inputs.publication_run }}
          ATTEMPT: ${{ inputs.publication_attempt }}
          INPUT_DIGEST: ${{ inputs.input_digest }}
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
          ORIGINAL_ATTEMPT: ${{ inputs.original_attempt }}
          ORIGINAL_ARTIFACT: ${{ inputs.original_artifact }}
          ARCHIVE_FORMAT: ${{ inputs.archive_format }}
          ORIGINAL_CANDIDATE_KEY: ${{ inputs.original_candidate_key }}
        run: |
          mkdir -p "$TMPDIR"
          python3 -m tools.package_runs prepare "$WORK" --package "$PACKAGE" --publication-run "$PUBLICATION" --publication-attempt "$ATTEMPT"
      - name: Restore this package's trusted build cache
        if: ${{ !inputs.recovery_mode && steps.prepare.outputs.reused != 'true' }}
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.ARCH_BUILD_CACHE }}
          key: ${{ steps.prepare.outputs.cache-key }}
          restore-keys: |
            ${{ steps.prepare.outputs.cache-input-prefix }}
            ${{ steps.prepare.outputs.cache-prefix }}
      - name: Build package without credentials
        if: ${{ !inputs.recovery_mode && steps.prepare.outputs.reused != 'true' }}
        id: build
        run: tools/build.sh "$WORK/input/bundle.json" "$WORK/output"
      - name: Authenticate actual compilation success
        id: compiled
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 -m tools.package_runs checkpoint "$WORK" --state success
      - name: Authenticate actual compilation failure
        id: compile_failed
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 -m tools.package_runs checkpoint "$WORK" --state failure
      - name: Authenticate compilation not started
        id: not_started
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 -m tools.package_runs checkpoint "$WORK" --state not-started
      - name: Make cache readable by the runner
        if: ${{ always() && steps.build.outcome != 'skipped' && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [[ -d "$ARCH_BUILD_CACHE" ]]; then
            sudo chown -R --no-dereference "$(id -u):$(id -g)" "$ARCH_BUILD_CACHE"
          fi
      - name: Save successful or failed compilation progress
        if: ${{ always() && !cancelled() && steps.build.outcome != 'skipped' && steps.prepare.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.ARCH_BUILD_CACHE }}
          key: ${{ steps.prepare.outputs.cache-key }}
      - name: Pack original outputs
        if: steps.build.outcome == 'success'
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          work = pathlib.Path(os.environ['WORK'])
          with tarfile.open(work / 'unsigned.tar', 'w') as archive:
              for path in sorted((work / 'output').iterdir()):
                  archive.add(path, arcname=path.name, recursive=False)
              archive.add(work / 'candidate.json', arcname='candidate.json', recursive=False)
          PY
      - name: Bind original producer and transport signer
        if: ${{ steps.build.outcome == 'success' || steps.prepare.outputs.transport-recovered == 'true' }}
        run: python3 -m tools.package_runs context "$WORK"
      - name: Attest original archive from accepted main
        if: ${{ steps.build.outcome == 'success' || steps.prepare.outputs.transport-recovered == 'true' }}
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.WORK }}/unsigned.tar
            ${{ env.WORK }}/attestation-context.json
      - name: Retain original attestation bundle
        if: ${{ always() && steps.attest.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" "$WORK/attestation.jsonl"
      - name: Retain original attempt archive before durable transport
        if: ${{ always() && (steps.build.outcome == 'success' || steps.prepare.outputs.transport-recovered == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-${{ inputs.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORK }}/unsigned.tar
            ${{ env.WORK }}/candidate.json
            ${{ env.WORK }}/attestation.jsonl
            ${{ env.WORK }}/compilation.json
            ${{ env.WORK }}/attestation-context.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist validated original bytes to draft build store
        if: ${{ (steps.build.outcome == 'success' || steps.prepare.outputs.transport-recovered == 'true') && steps.attest.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.package_runs persist "$WORK"
