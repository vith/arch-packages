name: Build one package
run-name: Build ${{ inputs.package }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      package:
        description: Requested package
        required: true
        type: string
      pr_number:
        description: Exact recipe PR
        required: true
        type: string
      recipe_sha:
        description: Exact recipe commit
        required: true
        type: string
      request_id:
        description: Reserved build request
        required: true
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
concurrency:
  group: package-request-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WORK: /home/runner/.local/state/arch-packages/build-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /home/runner/.local/state/arch-packages/build-${{ github.run_id }}-${{ github.run_attempt }}/tmp
      ARCH_BUILD_CACHE: /home/runner/.local/state/arch-packages/cache/pr/${{ inputs.package }}/${{ inputs.recipe_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision archive transport tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools
      - name: Register worker and export exact recipe
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          PR: ${{ inputs.pr_number }}
          RECIPE: ${{ inputs.recipe_sha }}
          REQUEST: ${{ inputs.request_id }}
        run: |
          mkdir -p "$TMPDIR"
          python3 -m tools.package_runs prepare "$WORK" --package "$PACKAGE" --pr-number "$PR" --recipe-sha "$RECIPE" --request-id "$REQUEST"
      - name: Restore this recipe head's isolated build cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.ARCH_BUILD_CACHE }}
          key: ${{ steps.prepare.outputs.cache-key }}
          restore-keys: |
            ${{ steps.prepare.outputs.cache-input-prefix }}
      - name: Restore exact accepted producer cache
        if: ${{ steps.cache.outputs.cache-matched-key == '' && steps.prepare.outputs.accepted-cache-key != '' }}
        id: accepted-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.prepare.outputs.accepted-cache-path }}
          key: ${{ steps.prepare.outputs.accepted-cache-key }}
      - name: Admit only exact accepted cache match
        if: ${{ steps.cache.outputs.cache-matched-key == '' && steps.prepare.outputs.accepted-cache-key != '' }}
        env:
          ACCEPTED_CACHE_PATH: ${{ steps.prepare.outputs.accepted-cache-path }}
          EXPECTED_CACHE_KEY: ${{ steps.prepare.outputs.accepted-cache-key }}
          MATCHED_CACHE_KEY: ${{ steps.accepted-cache.outcome == 'success' && steps.accepted-cache.outputs.cache-matched-key || '' }}
        run: |
          python3 - <<'PY'
          import os
          from tools.package_runs import admit_cache
          admit_cache(os.environ['ACCEPTED_CACHE_PATH'], os.environ['ARCH_BUILD_CACHE'],
                      os.environ['EXPECTED_CACHE_KEY'], os.environ['MATCHED_CACHE_KEY'])
          PY
      - name: Build package without credentials
        id: build
        run: tools/build.sh "$WORK/input/bundle.json" "$WORK/output"
      - name: Make isolated cache readable
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [[ -d "$ARCH_BUILD_CACHE" ]]; then
            sudo chown -R --no-dereference "$(id -u):$(id -g)" "$ARCH_BUILD_CACHE"
          fi
      - name: Save isolated compilation progress
        if: ${{ always() && !cancelled() && steps.prepare.outcome == 'success' && steps.build.outcome != 'skipped' && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.ARCH_BUILD_CACHE }}
          key: ${{ steps.prepare.outputs.cache-key }}
      - name: Pack original output and request
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          work = pathlib.Path(os.environ['WORK'])
          with tarfile.open(work / 'unsigned.tar', 'w') as archive:
              for path in sorted((work / 'output').iterdir()):
                  archive.add(path, arcname=path.name, recursive=False)
              archive.add(work / 'candidate.json', arcname='candidate.json', recursive=False)
          PY
      - name: Bind original producer
        run: python3 -m tools.package_runs context "$WORK"
      - name: Attest original archive and request
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.WORK }}/unsigned.tar
            ${{ env.WORK }}/attestation-context.json
      - name: Retain original attestation
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" "$WORK/attestation.jsonl"
      - name: Persist original durable output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.package_runs persist "$WORK"
