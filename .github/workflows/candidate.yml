name: Exact candidate validation
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numeric PR number; control and harness always come from main
        required: true
        type: string
env:
  OMP_WORK: /home/runner/.local/state/omp/work/arch-packages/${{ github.run_id }}/${{ github.run_attempt }}
  TMPDIR: /home/runner/.local/state/omp/work/arch-packages/${{ github.run_id }}/${{ github.run_attempt }}/tmp
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      head: ${{ steps.prepare.outputs.head }}
      mechanical: ${{ steps.prepare.outputs.mechanical }}
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$OMP_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -m tools.update prepare --pr "$PR_NUMBER" --directory "$OMP_WORK/prepared"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-candidate
          path: ${{ env.OMP_WORK }}/prepared
          if-no-files-found: error
          retention-days: 2
  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$OMP_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-candidate
          path: ${{ env.OMP_WORK }}/prepared
      - name: Build every frozen package without credentials
        run: |
          python3 -m tools.update extract --archive "$OMP_WORK/prepared/bundle.tar" --directory "$OMP_WORK/build-input"
          tools/build.sh "$OMP_WORK/build-input/bundle.json" "$OMP_WORK/outputs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-candidate
          path: ${{ env.OMP_WORK }}/outputs
          if-no-files-found: error
          retention-days: 2
  validate:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$OMP_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-candidate
          path: ${{ env.OMP_WORK }}/prepared
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-candidate
          path: ${{ env.OMP_WORK }}/outputs
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.update validate-build --record "$OMP_WORK/prepared/candidate.json" --directory "$OMP_WORK/outputs"
  report-failure:
    needs: [prepare, build, validate]
    if: always() && needs.prepare.result == 'success' && (needs.build.result != 'success' || needs.validate.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$OMP_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-candidate
          path: ${{ env.OMP_WORK }}/prepared
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.update fail-build --record "$OMP_WORK/prepared/candidate.json"
  manual-review:
    name: Review PR ${{ inputs.pr_number }} head ${{ needs.prepare.outputs.head }} base ${{ needs.prepare.outputs.base }}
    needs: [prepare, validate]
    if: needs.prepare.outputs.mechanical != 'true'
    environment: recipe-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$OMP_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-candidate
          path: ${{ env.OMP_WORK }}/prepared
      - name: Revalidate exact approved candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.update review --record "$OMP_WORK/prepared/candidate.json"
  finalize:
    needs: [prepare, validate, manual-review]
    if: always() && needs.validate.result == 'success' && (needs.manual-review.result == 'success' || needs.manual-review.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$OMP_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-candidate
          path: ${{ env.OMP_WORK }}/prepared
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-candidate
          path: ${{ env.OMP_WORK }}/outputs
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
        run: python3 -m tools.update finalize --pr "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA" --record "$OMP_WORK/prepared/candidate.json" --directory "$OMP_WORK/outputs"
