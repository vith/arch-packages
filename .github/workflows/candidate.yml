name: Exact candidate validation
run-name: Candidate PR ${{ inputs.pr_number }} head ${{ inputs.expected_head }}
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact same-repository PR number
        required: true
        type: string
      expected_head:
        description: Exact PR head SHA
        required: true
        type: string
      retry:
        description: Explicitly retry failed source validation or a failed/unregistered package request
        required: false
        default: false
        type: boolean
env:
  ARCH_WORK: /home/runner/.local/state/arch-packages/work/arch-packages/${{ github.run_id }}/${{ github.run_attempt }}
  TMPDIR: /home/runner/.local/state/arch-packages/work/arch-packages/${{ github.run_id }}/${{ github.run_attempt }}/tmp
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: write
      actions: write
      pull-requests: write
      statuses: write
    steps:
      - name: Prepare persistent scratch and trusted tools
        run: |
          mkdir -p "$ARCH_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RETRY: ${{ inputs.retry }}
        run: |
          args=()
          if [ "$RETRY" = true ]; then args+=(--retry); fi
          python3 -m tools.update prepare --pr "$PR_NUMBER" --directory "$ARCH_WORK/prepared" "${args[@]}"
      - name: Build exact recipe before merge
        if: steps.prepare.outputs.kind == 'recipe'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETRY: ${{ inputs.retry }}
        run: |
          args=()
          if [ "$RETRY" = true ]; then args+=(--retry); fi
          python3 -m tools.package_runs collect "$ARCH_WORK/prepared" "${args[@]}"
      - name: Finalize exact successful candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ steps.prepare.outputs.base }}
          HEAD_SHA: ${{ steps.prepare.outputs.head }}
        run: python3 -m tools.update finalize --pr "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA" --record "$ARCH_WORK/prepared/candidate.json" --directory "$ARCH_WORK/prepared"
      - name: Report exact-head failure
        if: failure() && steps.prepare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.update fail-build --record "$ARCH_WORK/prepared/candidate.json"
