name: ApexShot enrollment proof
on:
  push:
    branches: [add/apexshot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apexshot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WORK: /home/runner/.local/state/arch-packages/apexshot-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exact recipe and frozen inputs
        run: |
          set -euo pipefail
          mkdir -p "$WORK/input/recipes/apexshot"
          recipe=$(git ls-tree HEAD recipes/apexshot | cut -f1 | cut -d' ' -f3)
          git -c fetch.recurseSubmodules=false fetch --no-tags --no-recurse-submodules origin "$recipe"
          git archive "$recipe" | tar -x -C "$WORK/input/recipes/apexshot"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from tools.recipe_gate import harness_digest, input_digest
          from tools.update import validate_source_policy
          root = Path.cwd()
          work = Path(os.environ['WORK'])
          name = 'apexshot'
          policy = next(p for p in json.loads((root / 'packages.json').read_text())['packages'] if p['pkgbase'] == name)
          lock = json.loads((root / 'inputs/apexshot.json').read_text())
          validate_source_policy(lock, policy)
          pin = subprocess.check_output(['git', 'ls-tree', 'HEAD', 'recipes/apexshot'], text=True).split()[2]
          image = (root / 'build-image.txt').read_text().strip()
          harness = harness_digest(root)
          recipe = work / 'input/recipes/apexshot'
          head = os.environ['GITHUB_SHA']
          package = {'pkgbase': name, 'recipe_commit': pin, 'recipe_dir': 'recipes/apexshot', 'lock': lock, 'policy': policy, 'input_digest': input_digest(recipe, lock, policy, image, harness)}
          bundle = {'schema': 1, 'repository': 'vith/arch-packages', 'base': head, 'head': head, 'recipe_pins': {name: pin}, 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'image': image, 'harness_sha': harness, 'packages': [package]}
          (work / 'input/bundle.json').write_text(json.dumps(bundle))
          PY
      - name: Build from source without credentials or caches
        run: |
          set -euo pipefail
          tools/build.sh "$WORK/input/bundle.json" "$WORK/output" 2>&1 | tee "$WORK/build.log"
      - name: Install and exercise in a fresh unprivileged consumer container
        run: |
          set -euo pipefail
          image=$(cat build-image.txt)
          cat >"$WORK/consumer.sh" <<'SH'
          set -euo pipefail
          pacman -Syu --noconfirm --needed -- python binutils desktop-file-utils util-linux
          pacman -U --noconfirm -- /packages/*.pkg.tar.zst
          pacman -Q apexshot
          pacman -Ql apexshot > /apexshot-files.txt
          useradd --uid 1000 --create-home --shell /bin/bash consumer
          mkdir /evidence
          chown consumer:consumer /evidence
          setpriv --reuid=1000 --regid=1000 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs -- env -i PATH=/usr/bin HOME=/home/consumer LANG=C.UTF-8 bash /apexshot-smoke.sh 0.2.35-1 /evidence /apexshot-files.txt
          SH
          container=$(docker create --platform linux/amd64 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges "$image" bash /consumer.sh)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$WORK/output/." "$container:/packages"
          docker cp "$WORK/consumer.sh" "$container:/consumer.sh"
          docker cp tools/apexshot-smoke.sh "$container:/apexshot-smoke.sh"
          result=0
          docker start -a "$container" 2>&1 | tee "$WORK/consumer.log" || result=$?
          docker cp "$container:/evidence" "$WORK/consumer-evidence" || true
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apexshot-enrollment-proof
          path: ${{ env.WORK }}
          if-no-files-found: error
          retention-days: 7
