name: nasctui enrollment proof
on:
  push:
    branches: [source-only-packages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nasctui:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WORK: /home/runner/.local/state/arch-packages/nasctui-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exact recipe and frozen inputs
        run: |
          set -euo pipefail
          mkdir -p "$WORK/input/recipes/nasctui"
          recipe=$(git ls-tree HEAD recipes/nasctui | cut -f1 | cut -d' ' -f3)
          git -c fetch.recurseSubmodules=false fetch --no-tags --no-recurse-submodules origin "$recipe"
          git archive "$recipe" | tar -x -C "$WORK/input/recipes/nasctui"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from tools.recipe_gate import harness_digest, input_digest
          from tools.update import validate_source_policy
          root = Path.cwd()
          work = Path(os.environ['WORK'])
          name = 'nasctui'
          policy = next(p for p in json.loads((root / 'packages.json').read_text())['packages'] if p['pkgbase'] == name)
          lock = json.loads((root / 'inputs/nasctui.json').read_text())
          validate_source_policy(lock, policy)
          pin = subprocess.check_output(['git', 'ls-tree', 'HEAD', 'recipes/nasctui'], text=True).split()[2]
          image = (root / 'build-image.txt').read_text().strip()
          harness = harness_digest(root)
          recipe = work / 'input/recipes/nasctui'
          head = os.environ['GITHUB_SHA']
          package = {'pkgbase': name, 'recipe_commit': pin, 'recipe_dir': 'recipes/nasctui', 'lock': lock, 'policy': policy, 'input_digest': input_digest(recipe, lock, policy, image, harness)}
          bundle = {'schema': 1, 'repository': 'vith/arch-packages', 'base': head, 'head': head, 'recipe_pins': {name: pin}, 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'image': image, 'harness_sha': harness, 'packages': [package]}
          (work / 'input/bundle.json').write_text(json.dumps(bundle))
          PY
      - name: Build from source without credentials or caches
        run: |
          set -euo pipefail
          tools/build.sh "$WORK/input/bundle.json" "$WORK/output" 2>&1 | tee "$WORK/build.log"
      - name: Install and exercise in a fresh unprivileged consumer container
        run: |
          set -euo pipefail
          image=$(cat build-image.txt)
          cat >"$WORK/consumer.sh" <<'SH'
          set -euo pipefail
          mkdir -p /evidence
          pacman -Syu --noconfirm --needed -- python tmux binutils util-linux
          pacman -U --noconfirm -- /packages/*.pkg.tar.zst
          pacman -Q nasctui | tee /evidence/installed.txt
          useradd --uid 1000 --create-home --shell /bin/bash consumer
          mkdir -p /home/consumer/config /home/consumer/data /home/consumer/runtime
          chmod 700 /home/consumer/runtime
          chown -R consumer:consumer /home/consumer /evidence
          setpriv --reuid=1000 --regid=1000 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs -- env -i PATH=/usr/bin HOME=/home/consumer XDG_CONFIG_HOME=/home/consumer/config XDG_DATA_HOME=/home/consumer/data XDG_RUNTIME_DIR=/home/consumer/runtime LANG=C.UTF-8 TERM=xterm-256color bash /nasctui-smoke.sh
          SH
          cat >"$WORK/nasctui-smoke.sh" <<'SH'
          set -euo pipefail
          nasc --version > /evidence/nasc-version.txt
          readelf -d /usr/bin/nasc > /evidence/nasc-dynamic.txt
          ldd /usr/bin/nasc > /evidence/nasc-ldd.txt
          python - <<'PY'
          import re
          from pathlib import Path
          evidence = Path('/evidence')
          if (evidence / 'nasc-version.txt').read_text().strip() != 'v1.0.7':
              raise SystemExit('nasc exact runtime version mismatch')
          dynamic = (evidence / 'nasc-dynamic.txt').read_text()
          if not re.search(r'\(NEEDED\).*\[libqalculate\.so(?:\.[0-9]+)*\]', dynamic):
              raise SystemExit('nasc is not dynamically linked to libqalculate')
          linked = (evidence / 'nasc-ldd.txt').read_text()
          if 'not found' in linked or not re.search(r'libqalculate\.so(?:\.[0-9]+)*\s+=>\s+/\S+', linked):
              raise SystemExit('nasc libqalculate dynamic dependency did not resolve')
          PY
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" -f /dev/null new-session -d -x 100 -y 30 -s nasc nasc
          trap 'tmux -S "$XDG_RUNTIME_DIR/nasc.sock" kill-server || true' EXIT
          sleep 1
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" capture-pane -p -t nasc > /evidence/nasc-initial.txt
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" send-keys -t nasc -l '2+2'
          sleep 1
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" capture-pane -p -t nasc > /evidence/nasc-first.txt
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" send-keys -t nasc Enter
          sleep 1
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" capture-pane -p -t nasc > /evidence/nasc-next-line.txt
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" send-keys -t nasc -l 'ans*3'
          sleep 1
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" capture-pane -p -t nasc > /evidence/nasc-second.txt
          python - <<'PY'
          import re
          for file,expression,answer in [('nasc-first.txt','2+2','4'),('nasc-second.txt','ans*3','12')]:
              text=open('/evidence/'+file).read()
              if not any(expression in line.replace(' ','') and re.search(r'(?<![0-9])'+answer+r'(?![0-9])',line) for line in text.splitlines()): raise SystemExit('nasc expression/result absent: '+file)
          PY
          tmux -S "$XDG_RUNTIME_DIR/nasc.sock" send-keys -t nasc Escape
          sleep 1
          if tmux -S "$XDG_RUNTIME_DIR/nasc.sock" has-session -t nasc; then
            echo 'nasc did not exit cleanly after Escape' >&2
            exit 1
          fi
          trap - EXIT
          printf 'nasctui v1.0.7 linked libqalculate; 2+2=4; ans*3=12; Escape exited.\n' > /evidence/result.txt
          SH
          container=$(docker create --platform linux/amd64 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges "$image" bash /consumer.sh)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$WORK/output/." "$container:/packages"
          docker cp "$WORK/consumer.sh" "$container:/consumer.sh"
          docker cp "$WORK/nasctui-smoke.sh" "$container:/nasctui-smoke.sh"
          result=0
          docker start -a "$container" 2>&1 | tee "$WORK/consumer.log" || result=$?
          docker cp "$container:/evidence" "$WORK/consumer-evidence" || true
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nasctui-enrollment-proof
          path: ${{ env.WORK }}
          if-no-files-found: error
          retention-days: 7
