name: Temporary initial unsigned native build proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7abfe1986b063b0838d5497cdfd5b9d84d216c27
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: enrollment-non-omp
          path: ${{ runner.temp }}/receipts
          github-token: ${{ github.token }}
          repository: vith/arch-packages
          run-id: 37083314723
      - name: Validate receipts and stage disposable five-package view
        run: |
          python3 -m tools.update extract --source-receipts --archive "$RUNNER_TEMP/receipts/source-data.tar" --directory "$RUNNER_TEMP/source-data"
          python3 - <<'PY'
          import importlib.util, json, os, shutil
          from pathlib import Path
          from tools import publish, github_api
          root = Path.cwd()
          original = json.loads((root / 'packages.json').read_text())
          assert 'oh-my-pi-vith-git' in {p['pkgbase'] for p in original['packages']}
          scoped = {**original, 'packages': [p for p in original['packages'] if p['pkgbase'] != 'oh-my-pi-vith-git']}
          (root / 'packages.json').write_bytes(github_api.canonical(scoped))
          spec = importlib.util.spec_from_file_location('accept_enrollment', root / '.github/enrollment-accept.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          temp = Path(os.environ['RUNNER_TEMP'])
          accepted = temp / 'validated'
          module.validate([temp / 'source-data'], accepted, None)
          (root / 'inputs').mkdir(exist_ok=True)
          for policy in scoped['packages']:
              name = policy['pkgbase']
              shutil.rmtree(root / 'recipes' / name)
              shutil.copytree(accepted / name / 'recipe', root / 'recipes' / name, symlinks=True)
              shutil.copyfile(accepted / name / 'lock.json', root / 'inputs' / (name + '.json'))
          plan = publish.expectations('7abfe1986b063b0838d5497cdfd5b9d84d216c27', os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], None)
          bundle_dir = temp / 'native-bundle'
          bundle_dir.mkdir()
          packages = []
          for package in plan['packages']:
              shutil.copytree(root / package['recipe_dir'], bundle_dir / package['recipe_dir'], symlinks=True)
              packages.append({k: package[k] for k in ('pkgbase', 'recipe_dir', 'lock', 'policy', 'input_digest')})
          (bundle_dir / 'bundle.json').write_bytes(github_api.canonical({**plan, 'packages': packages}))
          (temp / 'scoped-proof.json').write_bytes(github_api.canonical({'accepted_head': plan['head'], 'original_packages': [p['pkgbase'] for p in original['packages']], 'proof_packages': [p['pkgbase'] for p in scoped['packages']], 'main_policy_modified': False, 'source_run': '37083314723'}))
          PY
      - name: Execute existing unsigned native harness without credentials
        run: tools/build.sh "$RUNNER_TEMP/native-bundle/bundle.json" "$RUNNER_TEMP/unsigned"
      - name: Validate actual unsigned outputs against existing publication expectations
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools import publish
          temp = Path(os.environ['RUNNER_TEMP'])
          plan = publish.expectations('7abfe1986b063b0838d5497cdfd5b9d84d216c27', os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], None)
          publish.validate_unsigned(temp / 'unsigned', plan)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: initial-non-omp-unsigned-native-proof
          path: |
            ${{ runner.temp }}/unsigned
            ${{ runner.temp }}/scoped-proof.json
            ${{ runner.temp }}/validated/accepted.json
          retention-days: 7
          if-no-files-found: error
