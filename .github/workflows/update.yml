name: Source update proposals
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Read-only initial source freeze/probe; never writes proposals
        required: false
        type: boolean
        default: false
env:
  OMP_WORK: /home/runner/.local/state/omp/work/arch-packages/${{ github.run_id }}/${{ github.run_attempt }}
  TMPDIR: /home/runner/.local/state/omp/work/arch-packages/${{ github.run_id }}/${{ github.run_attempt }}/tmp
permissions:
  contents: read
concurrency:
  group: source-update
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$OMP_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Read immutable recipe data and probe in credential-free containers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = true ]; then
            python3 -m tools.update bootstrap --directory "$OMP_WORK/discovery"
          else
            python3 -m tools.update discover --directory "$OMP_WORK/discovery"
          fi
          python3 -m tools.update pack --directory "$OMP_WORK/discovery" --archive "$OMP_WORK/source-data.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-receipts
          path: ${{ env.OMP_WORK }}/source-data.tar
          retention-days: 2
          if-no-files-found: error
  write-proposals:
    needs: discover
    if: inputs.bootstrap != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$OMP_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-receipts
          path: ${{ env.OMP_WORK }}/receipts
      - name: Validate data and write proposals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m tools.update extract --source-receipts --archive "$OMP_WORK/receipts/source-data.tar" --directory "$OMP_WORK/source-data"
          python3 -m tools.update write --directory "$OMP_WORK/source-data"
