name: Source update proposals
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Read-only static initial source freeze; never executes recipes or writes proposals
        required: false
        type: boolean
        default: false
      migrate_pr:
        description: Legacy pull request number to convert or backfill using trusted main
        required: false
        type: string
        default: ''
      reconcile_pr:
        description: Recover only this existing recipe or bookkeeping pull request using trusted main
        required: false
        type: string
        default: ''
env:
  ARCH_WORK: /home/runner/.local/state/arch-packages/work/arch-packages/${{ github.run_id }}/${{ github.run_attempt }}
  TMPDIR: /home/runner/.local/state/arch-packages/work/arch-packages/${{ github.run_id }}/${{ github.run_attempt }}/tmp
permissions:
  contents: read
concurrency:
  group: source-update
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && (inputs.bootstrap != true || inputs.migrate_pr != '' || inputs.reconcile_pr != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - name: Validate explicit recovery mode
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          MIGRATE_PR: ${{ inputs.migrate_pr }}
          RECONCILE_PR: ${{ inputs.reconcile_pr }}
        run: |
          if [ -n "$MIGRATE_PR" ] && [ -n "$RECONCILE_PR" ]; then
            echo "::error::migrate_pr and reconcile_pr cannot be requested together"
            exit 1
          fi
          target="$MIGRATE_PR$RECONCILE_PR"
          if [ -n "$target" ]; then
            if [ "$BOOTSTRAP" = true ]; then
              echo "::error::bootstrap and explicit recovery cannot be requested together"
              exit 1
            fi
            if [[ ! "$target" =~ ^[0-9]+$ || ! "$target" =~ [1-9] ]]; then
              echo "::error::recovery target must be a positive decimal pull request number"
              exit 1
            fi
          fi
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$ARCH_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Migrate or backfill explicit legacy recipe candidate
        if: inputs.migrate_pr != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIGRATE_PR: ${{ inputs.migrate_pr }}
        run: python3 -m tools.update migrate-existing --pr "$MIGRATE_PR"
      - name: Recover exact open and accepted recipe candidates
        if: inputs.migrate_pr == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECONCILE_PR: ${{ inputs.reconcile_pr }}
        run: |
          args=()
          if [ -n "$RECONCILE_PR" ]; then args+=(--pr "$RECONCILE_PR"); fi
          python3 -m tools.update reconcile "${args[@]}"
  discover:
    needs: reconcile
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'push' && inputs.migrate_pr == '' && inputs.reconcile_pr == '' && (needs.reconcile.result == 'success' || needs.reconcile.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$ARCH_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Freeze immutable recipe data without execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = true ]; then
            python3 -m tools.update bootstrap --directory "$ARCH_WORK/discovery"
          else
            python3 -m tools.update discover --directory "$ARCH_WORK/discovery"
          fi
          python3 -m tools.update pack --directory "$ARCH_WORK/discovery" --archive "$ARCH_WORK/source-data.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-receipts
          path: ${{ env.ARCH_WORK }}/source-data.tar
          retention-days: 2
          if-no-files-found: error
  write-proposals:
    needs: discover
    if: inputs.bootstrap != true && inputs.migrate_pr == '' && inputs.reconcile_pr == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - name: Prepare persistent scratch and trusted validation tools
        run: |
          mkdir -p "$ARCH_WORK" "$TMPDIR"
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-receipts
          path: ${{ env.ARCH_WORK }}/receipts
      - name: Validate data and write proposals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m tools.update extract --source-receipts --archive "$ARCH_WORK/receipts/source-data.tar" --directory "$ARCH_WORK/source-data"
          python3 -m tools.update write --directory "$ARCH_WORK/source-data"
