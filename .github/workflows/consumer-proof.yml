name: Signed snapshot consumer proof
on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: Exact signed snapshot to install
        required: true
        type: string
permissions:
  contents: read
jobs:
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROOF_WORK: /home/runner/.local/state/arch-packages/work/consumers-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /home/runner/.local/state/arch-packages/work/consumers-${{ github.run_id }}-${{ github.run_attempt }}/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify signed snapshot and prepare installation expectations
        env:
          SNAPSHOT: ${{ inputs.snapshot_tag }}
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y gnupg libarchive-tools
          python3 -m tools.consumer --snapshot "$SNAPSHOT" --directory "$PROOF_WORK/verified"
      - name: Install every package with required signatures and exercise consumers
        env:
          SNAPSHOT: ${{ inputs.snapshot_tag }}
        run: tools/smoke.sh "$PROOF_WORK/verified/expected.json" "$PROOF_WORK/evidence" "$SNAPSHOT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_WORK }}/evidence
          if-no-files-found: warn
          retention-days: 14
