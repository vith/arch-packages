name: Temporary full enrollment native proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Freeze all accepted recipe gitlinks and execute native probes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          work="$HOME/.local/state/omp/work/enrollment-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work/tmp"
          export TMPDIR="$work/tmp"
          python3 -m tools.update bootstrap --directory "$work/enrollment"
          python3 -m tools.update pack --directory "$work/enrollment" --archive "$work/source-data.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enrollment-all
          path: ~/.local/state/omp/work/enrollment-${{ github.run_id }}-${{ github.run_attempt }}/source-data.tar
          retention-days: 14
          if-no-files-found: error
