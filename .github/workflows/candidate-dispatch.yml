name: Start candidate validation
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: write
  pull-requests: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # This job never checks out or executes candidate code. The dispatched
      # main workflow fetches immutable candidate data and isolates its tests.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          number = str(int(os.environ['PR_NUMBER']))
          current = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/pulls/{number}']))
          if current['state'] != 'open' or current['base']['ref'] != 'main':
              raise SystemExit('Not an open main candidate')
          subprocess.run(['gh', 'workflow', 'run', 'candidate.yml', '--repo', repository, '--ref', 'main', '-f', 'pr_number=' + number], check=True)
          PY
