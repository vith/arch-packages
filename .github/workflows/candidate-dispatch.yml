name: Start candidate validation
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: write
  pull-requests: read
jobs:
  dispatch:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Only main-targeting PRs use this metadata event. Recipe-root branches
      # contain no workflows: the trusted writer explicitly dispatches them,
      # and the scheduled/main update reconciliation recovers missed events.
      # This job never checks out or executes candidate code.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          number = str(int(os.environ['PR_NUMBER']))
          current = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/pulls/{number}']))
          if current['state'] != 'open' or current['base']['ref'] != 'main':
              raise SystemExit('Not an open main candidate')
          subprocess.run(['gh', 'workflow', 'run', 'candidate.yml', '--repo', repository, '--ref', 'main', '-f', 'pr_number=' + number, '-f', 'expected_head=' + current['head']['sha']], check=True)
          PY
