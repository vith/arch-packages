name: Start candidate validation
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: write
  pull-requests: read
  statuses: write
jobs:
  dispatch:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Only protected-main tools execute here, never the proposed PR checkout.
      # Recipe-root branches have no workflows and use explicit manager handoffs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:

          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import os
          from tools.update import dispatch
          dispatch(int(os.environ['PR_NUMBER']))
          PY
