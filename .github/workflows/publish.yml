name: Signed package snapshots
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact accepted main SHA (publish only)
        required: false
        type: string
      operation:
        description: Publish accepted main or explicitly restore a retained snapshot
        default: publish
        type: choice
        options: [publish, rollback]
      target_tag:
        description: Retained snapshot tag for rollback
        type: string
      expected_tag:
        description: Expected current latest snapshot tag for rollback
        type: string
      expected_release_id:
        description: Expected current latest release ID for rollback
        type: string
env:
  TMPDIR: /home/runner/.local/state/arch-packages/work/tmp-${{ github.run_id }}-${{ github.run_attempt }}
permissions:
  contents: read
concurrency:
  group: arch-packages-publication
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read
    outputs:
      accepted_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve exact accepted target
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.accepted_sha }}
          EVENT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$TMPDIR"
          python3 - <<'PY'
          import json, os, re, urllib.request
          sha = os.environ['REQUESTED_SHA'] or os.environ['EVENT_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha): raise ValueError('full accepted SHA required')
          request = urllib.request.Request('https://api.github.com/repos/vith/arch-packages/git/ref/heads/main', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=90) as response:
              if json.load(response)['object']['sha'] != sha: raise ValueError('target is not current trusted main')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - name: Install trusted read-only runner tools
        run: sudo apt-get update && sudo apt-get install -y gnupg libarchive-tools
      - name: Bind current main and signed previous inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          mkdir -p "$HOME/.local/state/arch-packages/work"
          python3 tools/publish.py plan --accepted-sha "$ACCEPTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output-dir "$HOME/.local/state/arch-packages/work/publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-plan-${{ github.run_attempt }}
          path: ~/.local/state/arch-packages/work/publication-${{ github.run_id }}-${{ github.run_attempt }}/publication-plan.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/.local/state/arch-packages/work/publication-${{ github.run_id }}-${{ github.run_attempt }}/unsigned.tar
            ~/.local/state/arch-packages/work/publication-${{ github.run_id }}-${{ github.run_attempt }}/publication-plan.json
          if-no-files-found: error
          retention-days: 7
  rollback:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Install trusted public verification tools
        run: mkdir -p "$TMPDIR" && sudo apt-get update && sudo apt-get install -y gnupg libarchive-tools
      - name: Independently verify retained snapshot and explicitly promote
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.target_tag }}
          EXPECTED_TAG: ${{ inputs.expected_tag }}
          EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
        run: |
          mkdir -p "$HOME/.local/state/arch-packages/work"
          python3 tools/publish.py rollback --target-tag "$TARGET_TAG" --expected-tag "$EXPECTED_TAG" --expected-release-id "$EXPECTED_RELEASE_ID" --work-dir "$HOME/.local/state/arch-packages/work/rollback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Record rollback receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rollback-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.local/state/arch-packages/work/rollback-${{ github.run_id }}-${{ github.run_attempt }}/publication-result.json
          if-no-files-found: warn
  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      actions: read
    steps:
      - name: Rebind trusted main before checking out publisher controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ needs.collect.outputs.accepted_sha }}
        run: |
          mkdir -p "$TMPDIR"
          python3 - <<'PY'
          import json, os, re, urllib.request
          sha = os.environ['ACCEPTED_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha): raise ValueError('full accepted SHA required')
          request = urllib.request.Request('https://api.github.com/repos/vith/arch-packages/git/ref/heads/main', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=90) as response:
              if json.load(response)['object']['sha'] != sha: raise ValueError('accepted commit is stale')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.collect.outputs.accepted_sha }}
          persist-credentials: false
      - name: Install trusted publisher tools before secrets
        run: sudo apt-get update && sudo apt-get install -y gnupg libarchive-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: unsigned-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.local/state/arch-packages/work/publication-input-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate sign release readback then activate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCH_SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
          ARCH_SIGNING_PASSPHRASE: ${{ secrets.ARCH_SIGNING_PASSPHRASE }}
          ARCH_SIGNING_FINGERPRINT: ${{ vars.ARCH_SIGNING_FINGERPRINT }}
          ACCEPTED_SHA: ${{ needs.collect.outputs.accepted_sha }}
        run: |
          python3 tools/publish.py publish --accepted-sha "$ACCEPTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --plan "$HOME/.local/state/arch-packages/work/publication-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/publication-plan.json" --artifact "$HOME/.local/state/arch-packages/work/publication-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/unsigned.tar" --work-dir "$HOME/.local/state/arch-packages/work/signed-publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Record public verification and rollback evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.local/state/arch-packages/work/signed-publication-${{ github.run_id }}-${{ github.run_attempt }}/publication-result.json
          if-no-files-found: error
