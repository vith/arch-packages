name: Signed package snapshots
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact accepted main SHA
        required: true
        type: string
      bootstrap:
        description: First snapshot only; skip Worker activation
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: n3t-arch-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      accepted_sha: ${{ steps.target.outputs.sha }}
      bootstrap: ${{ steps.target.outputs.bootstrap }}
    steps:
      - name: Resolve exact accepted target
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.accepted_sha }}
          EVENT_SHA: ${{ github.sha }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          sha = os.environ['REQUESTED_SHA'] or os.environ['EVENT_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha): raise ValueError('full accepted SHA required')
          request = urllib.request.Request('https://api.github.com/repos/vith/arch-packages/git/ref/heads/main', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=90) as response:
              if json.load(response)['object']['sha'] != sha: raise ValueError('target is not current trusted main')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\nbootstrap=' + os.environ['BOOTSTRAP'] + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - name: Install trusted read-only runner tools
        run: sudo apt-get update && sudo apt-get install -y gnupg libarchive-tools
      - name: Bind current main and signed previous inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ steps.target.outputs.sha }}
          BOOTSTRAP: ${{ steps.target.outputs.bootstrap }}
        run: |
          args=()
          if [[ "$BOOTSTRAP" == true ]]; then args+=(--bootstrap); fi
          python3 tools/publish.py plan --accepted-sha "$ACCEPTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output-dir "$RUNNER_TEMP/publication" "${args[@]}"
      - name: Build changed immutable inputs without credentials
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication'
          bundle = json.loads((root / 'bundle/bundle.json').read_text())
          output = root / 'unsigned'
          if bundle['packages']:
              subprocess.run(['tools/build.sh', str(root / 'bundle/bundle.json'), str(output)], check=True)
          else:
              output.mkdir()
              (output / 'native-evidence.json').write_text(json.dumps(bundle, sort_keys=True, separators=(',', ':')) + '\n')
          PY
      - name: Package bounded unsigned data
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication'
          with tarfile.open(root / 'unsigned.tar', 'w') as archive:
              for path in sorted((root / 'unsigned').iterdir()): archive.add(path, arcname=path.name, recursive=False)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication/unsigned.tar
            ${{ runner.temp }}/publication/publication-plan.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      actions: read
    steps:
      - name: Rebind trusted main before checking out publisher controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ needs.build.outputs.accepted_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          sha = os.environ['ACCEPTED_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha): raise ValueError('full accepted SHA required')
          request = urllib.request.Request('https://api.github.com/repos/vith/arch-packages/git/ref/heads/main', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=90) as response:
              if json.load(response)['object']['sha'] != sha: raise ValueError('accepted commit is stale')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.accepted_sha }}
          persist-credentials: false
      - name: Install trusted publisher tools before secrets
        run: sudo apt-get update && sudo apt-get install -y gnupg libarchive-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-input
      - name: Validate sign release readback then activate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCH_SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
          ARCH_SIGNING_PASSPHRASE: ${{ secrets.ARCH_SIGNING_PASSPHRASE }}
          ARCH_SIGNING_FINGERPRINT: ${{ vars.ARCH_SIGNING_FINGERPRINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCEPTED_SHA: ${{ needs.build.outputs.accepted_sha }}
          BOOTSTRAP: ${{ needs.build.outputs.bootstrap }}
        run: |
          args=()
          if [[ "$BOOTSTRAP" == true ]]; then args+=(--bootstrap); fi
          python3 tools/publish.py publish --accepted-sha "$ACCEPTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --plan "$RUNNER_TEMP/publication-input/publication-plan.json" --artifact "$RUNNER_TEMP/publication-input/unsigned.tar" --work-dir "$RUNNER_TEMP/signed-publication" "${args[@]}"
      - name: Record public verification and rollback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-publication/publication-result.json
          if-no-files-found: error
