name: Trusted recipe and publication verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark exact commit verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=verify -f state=pending -f description='Running exact-commit regression tests'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run trusted tests with native pinned Arch vercmp
        shell: bash
        run: |
          set -euo pipefail
          image=$(cat build-image.txt)
          container=$(docker create --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges "$image" /bin/bash -c 'pacman -Syu --noconfirm --needed -- python git gnupg && cd /verify && python -m unittest discover -s tests -p "test_*.py"')
          trap 'docker rm -f "$container" >/dev/null' EXIT
          mkdir -p .work/verification-root
          cp -R tools tests build-image.txt .work/verification-root/
          docker cp .work/verification-root "$container:/verify"
          docker start -a "$container"
      - name: Report exact commit verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success|failure) state="$RESULT" ;;
            *) state=error ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context=verify -f state="$state" \
            -f description='Exact-commit regression test result' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
