name: Temporary read-only cutover smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_WORK: /home/runner/.local/state/arch-packages/work/native-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare standalone Git-source dynamic pkgver fixture
        run: python3 -m tools.hosted_cutover_smoke prepare
      - name: Build only on disposable hosted Arch x86_64 runner
        run: tools/build.sh "$SMOKE_WORK/bundle/bundle.json" "$SMOKE_WORK/native"
      - name: Observe native archive and capability-dropped binary
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          python3 -m tools.hosted_cutover_smoke verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: unsigned-native-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SMOKE_WORK }}/native
            ${{ env.SMOKE_WORK }}/native-smoke-report.json
          if-no-files-found: warn
          retention-days: 7
  historical-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SNAPSHOT: snapshot-f5b1f735737944150331d06e0b05506f5c7d6957-38059323097-1
      PROOF_WORK: /home/runner/.local/state/arch-packages/work/consumer-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /home/runner/.local/state/arch-packages/work/consumer-smoke-${{ github.run_id }}-${{ github.run_attempt }}/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify existing signed snapshot with new consumer code
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y gnupg libarchive-tools
          python3 -m tools.consumer --snapshot "$SNAPSHOT" --directory "$PROOF_WORK/verified"
      - name: Install original signed packages and exercise allowed consumers
        run: tools/smoke.sh "$PROOF_WORK/verified/expected.json" "$PROOF_WORK/verified/enrollment.json" "$PROOF_WORK/evidence" "$SNAPSHOT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: historical-consumer-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_WORK }}/evidence
          if-no-files-found: warn
          retention-days: 7
